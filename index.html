<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Try</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #535353;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        flex-direction: column;
        color: white;
        font-family: Arial, Helvetica, sans-serif;
      }
      .cont {
        color: black;
        width: 600px;
        height: 300px;
        background-color: white;
        display: flex;
        justify-content: space-between;
        padding: 60px;
        border-radius: 40px;
        align-items: center;
      }
      img {
        object-fit: contain;
      }
      .nums {
        width: 40%;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      img {
        border-radius: 30px;
      }
      input {
        padding: 10px;
        border-radius: 10px;
        border: 1px solid green;
      }
    </style>
  </head>
  <body>
    <h1>Калькулятор теоремы Пифагора!</h1>
    <div class="cont">
      <div class="nums">
        <input
          id="a"
          onchange="Poschitat()"
          placeholder="Введите А"
          type="number"
        />
        <input
          id="b"
          onchange="Poschitat()"
          placeholder="Введите B"
          type="number"
        />
        <h1>С = <span id="c">0</span></h1>
      </div>
      <img
        width="300px"
        src="https://resizer.mail.ru/p/5330f986-2a82-5c60-8224-feb99aba4949/AQAJpxFB-x1lRoSxy_z904keBc7nk_iYqcEg_EjZ-hng4H3pRep9bPuCMdDcXj0rWx3X5CqZdL8B4gDCa4BmFhx9qno.jpg"
        alt=""
      />

      <script>
        function Poschitat() {
          const a = document.getElementById("a").value;
          const b = document.getElementById("b").value;
          const c = document.getElementById("c");

          c.innerHTML = Math.sqrt(a * a + b * b).toFixed(1);
        }
      </script>
    </div>
  </body>
</html>
